<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン | Color Adviser</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

<header class="header">
    <div class="logo">
        <span class="bar"></span>
        <h1>Color Adviser</h1>
    </div>

    <nav>
        <a href="index.html" class="history-btn">HOME</a>
        <a href="register.html" class="login-btn">新規登録</a>
    </nav>
</header>

<main class="login-page">

    <div class="badge">
        🎨 AIカラーパレット生成ツール
    </div>

    <h2>ログイン</h2>

    <p class="subtitle">
        ログインして、あなたの配色アイデアを振り返ろう。
    </p>

    <div class="login-card">

        <label>メールアドレス</label>
        <input
            type="email"
            placeholder="example@email.com">

        <label>パスワード</label>
        <input
            type="password"
            placeholder="パスワードを入力">

        <div class="login-options">
            <label class="remember">
                <input type="checkbox">
                ログイン状態を保持
            </label>

            <a href="#">パスワードをお忘れの方</a>
        </div>

        <button class="login-submit">
            ログイン
        </button>

        <div class="divider"></div>

        <p class="register-text">
            アカウントをお持ちでない方
        </p>

        <a href="register.html" class="register-link">
            新規登録はこちら
        </a>

    </div>

    <a href="index.html" class="back-home">
        ← ホームに戻る
    </a>

</main>

<footer class="footer">
    <div>© 2026 Color Adviser</div>

    <div class="footer-links">
        <a href="#">プライバシー</a>
        <a href="#">利用規約</a>
    </div>
</footer>

</body>
</html>
