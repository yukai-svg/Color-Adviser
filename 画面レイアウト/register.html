<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録 | Color Adviser</title>
    <link rel="stylesheet" href="/css/register.css">
</head>
<body>

<header class="header">
    <div class="logo">
        <span class="bar"></span>
        <h1>Color Adviser</h1>
    </div>

    <nav>
        <a href="index.html" class="home-btn">HOME</a>
        <a href="login.html" class="login-btn">ログイン</a>
    </nav>
</header>

<main class="register-page">

    <div class="badge">
        🎨 AIカラーパレット生成ツール
    </div>

    <h2>新規登録</h2>

    <p class="subtitle">
        アカウントを作成して、あなたの配色アイデアを残そう。
    </p>

    <div class="register-card">

        <label>メールアドレス</label>
        <input
            type="email"
            placeholder="example@email.com">

        <label>パスワード</label>
        <input
            type="password"
            placeholder="パスワードを入力">

        <p class="password-note">
            半角英字・数字を含む8文字以上で入力してください。
        </p>

        <label>パスワード（確認）</label>
        <input
            type="password"
            placeholder="パスワードをもう一度入力">

        <label class="agree">
            <input type="checkbox">
            利用規約とプライバシーポリシーに同意する
        </label>

        <button class="register-btn">
            新規登録
        </button>

        <div class="divider"></div>

        <p class="login-text">
            すでにアカウントをお持ちの方
        </p>

        <a href="login.html" class="login-link">
            ログインはこちら
        </a>

    </div>

    <a href="index.html" class="back-home">
        ← ホームに戻る
    </a>

</main>

<footer class="footer">
    <div>© 2026 Color Adviser</div>

    <div class="footer-links">
        <a href="#">プライバシー</a>
        <a href="#">利用規約</a>
    </div>
</footer>

</body>
</html>
